version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: mahallen_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mahallen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mahallen_pass}
      POSTGRES_DB: ${POSTGRES_DB:-mahallen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mahallen_user} -d ${POSTGRES_DB:-mahallen_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mahallen_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-mahallen_user}:${POSTGRES_PASSWORD:-mahallen_pass}@db:5432/${POSTGRES_DB:-mahallen_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
